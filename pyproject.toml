[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "letmelead"
version = "1.0.0"
description = "Multi-tenant buying-signal lead engine with qualified leads, credits and paced LinkedIn outreach."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "email-validator>=2.2",
  "pyjwt>=2.9",
  "argon2-cffi>=23.1",
  "celery[redis]>=5.4",
  "redis>=5.2",
  "httpx>=0.27",
  "stripe>=11.2",
  "playwright>=1.48",
  "python-multipart>=0.0.12",
  "mcp>=1.2.0",
  "cryptography>=43.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "respx>=0.21",
]

[project.scripts]
letmelead-mcp = "letmelead_mcp.server:main"

# The repo is an application, not a library: no Python packages are installed.
# Imports resolve through PYTHONPATH (see Makefile, Dockerfiles and pytest config).
[tool.setuptools]
packages = []

[tool.pytest.ini_options]
pythonpath = ["apps/api", "apps/worker", "packages/mcp", "."]
testpaths = ["apps/api/tests", "packages/mcp/tests"]
filterwarnings = ["ignore::DeprecationWarning"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# UP046 prefers PEP 695 generic syntax, which changes runtime behaviour for pydantic models.
ignore = ["B008", "E501", "UP046"]

[tool.ruff.lint.per-file-ignores]
"apps/api/alembic/*" = ["I001", "E402", "F401"]
