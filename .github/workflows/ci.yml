name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: letmelead
          POSTGRES_PASSWORD: letmelead
          POSTGRES_DB: letmelead_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U letmelead" --health-interval 10s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://letmelead:letmelead@localhost:5432/letmelead_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-secret-value
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check apps packages scripts
      - name: Migrate
        run: PYTHONPATH=apps/api alembic -c apps/api/alembic.ini upgrade head
      - name: Test
        run: PYTHONPATH=apps/api:packages/mcp pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: letmelead
          POSTGRES_PASSWORD: letmelead
          POSTGRES_DB: letmelead_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U letmelead" --health-interval 10s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://letmelead:letmelead@localhost:5432/letmelead_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-secret-value
      CORS_ORIGINS: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:8000
      E2E_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Migrate and seed
        run: |
          PYTHONPATH=apps/api alembic -c apps/api/alembic.ini upgrade head
          python scripts/seed.py
          python scripts/seed_e2e.py
      - name: Start API
        run: |
          PYTHONPATH=apps/api nohup python -m uvicorn letmelead.main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/v1/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/v1/health
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Build and start web
        working-directory: apps/web
        run: |
          npm run build
          nohup npm run start > /tmp/web.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -fsS http://localhost:3000/ > /dev/null && break
            sleep 2
          done
          curl -fsS http://localhost:3000/ > /dev/null
      - name: Browser journey
        working-directory: apps/web
        run: npx playwright test
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f infra/Dockerfile.api -t letmelead-api:ci .
      - name: Build web image
        run: docker build -f infra/Dockerfile.web -t letmelead-web:ci .
