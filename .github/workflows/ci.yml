name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: letmelead
          POSTGRES_PASSWORD: letmelead
          POSTGRES_DB: letmelead_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U letmelead" --health-interval 10s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://letmelead:letmelead@localhost:5432/letmelead_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-secret-value
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check apps packages scripts
      - name: Migrate
        run: PYTHONPATH=apps/api alembic -c apps/api/alembic.ini upgrade head
      - name: Test
        run: PYTHONPATH=apps/api:packages/mcp pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f infra/Dockerfile.api -t letmelead-api:ci .
      - name: Build web image
        run: docker build -f infra/Dockerfile.web -t letmelead-web:ci .
